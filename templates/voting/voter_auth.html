{% extends 'base_auth.html' %}
{% block title %}Voting Station Access{% endblock %}
{% block content %}
<section class="auth-card p-4 p-md-5">
    <div class="text-center mb-4"><i class="bi bi-person-vcard text-primary fs-1"></i><h1 class="h3 mt-2 mb-1">Voting Station</h1><p class="text-muted mb-0">Step 1 — Voter verification</p></div>
    <form method="post" action="{% url 'voting:verify' %}">
        {% csrf_token %}
        <div class="mb-4"><label for="voter_card_id" class="form-label">Voter's Card Number</label><input type="text" class="form-control form-control-lg" id="voter_card_id" name="voter_card_id" autocomplete="off" required autofocus></div>
        <button type="submit" class="btn btn-primary btn-lg w-100">Verify Voter</button>
    </form>
</section>
{% endblock %}

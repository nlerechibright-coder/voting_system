{% extends 'base_auth.html' %}

{% block title %}Login - VoteChain{% endblock %}

{% block content %}
<div class="card auth-card p-4">
    <div class="card-body">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2 fw-bold text-primary">VoteChain</h3>
            <p class="text-muted">Secure Electronic Voting System</p>
        </div>
        
        <form method="post" action="{% url 'authentication:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Don't have an account? 
                <a href="{% url 'authentication:register' %}" class="text-primary fw-semibold text-decoration-none">Register here</a>
            </p>
        </div>
    </div>
</div>

<style>
    .auth-card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
</style>
{% endblock %}

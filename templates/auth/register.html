{% extends 'base_auth.html' %}

{% block title %}Register - VoteChain{% endblock %}

{% block content %}
<div class="card auth-card p-4">
    <div class="card-body">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2 fw-bold text-primary">Create Account</h3>
            <p class="text-muted">Register to manage your elections</p>
        </div>
        
        <form method="post" action="{% url 'authentication:register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="full_name" class="form-label fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe">
                </div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-at"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email (Optional)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-person-plus me-2"></i> Create Account
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Already have an account? 
                <a href="{% url 'authentication:login' %}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
            </p>
        </div>
    </div>
</div>

<style>
    .auth-card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
</style>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VoteChain - Voting Station{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        body { background: #f4f7fb; min-height: 100vh; }
        .voting-shell { min-height: 100vh; display: flex; align-items: center; padding: 2rem 0; position: relative; }
        .auth-card { border-radius: 8px; box-shadow: 0 8px 24px rgba(15, 23, 42, .12); background: #fff; }
        .station-logout-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; }
    </style>
</head>
<body>
    <!-- Prominent Lock Station Button -->
    {% if user.is_authenticated %}
    <div class="station-logout-btn">
        <form action="{% url 'authentication:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm shadow-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Lock Station & Logout
            </button>
        </form>
    </div>
    {% endif %}

    <main class="voting-shell">
        <div class="container {% block container_class %}{% endblock %}">
            <div class="row justify-content-center">
                <div class="{% block content_column %}col-md-7 col-lg-5{% endblock %}">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends 'base_dashboard.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body text-center p-5">
        <div class="bg-primary bg-opacity-10 p-4 rounded-circle d-inline-block mb-4">
            <i class="bi bi-tools text-primary fs-1"></i>
        </div>
        <h2 class="fw-bold mb-3">{{ page_title }}</h2>
        <p class="text-muted lead mb-4">
            This module is fully wired to the dashboard and ready for its specific UI implementation.
        </p>
        <a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
